project_id = "wordroom"

[db]
port = 54322
major_version = 17

# Both seeds run on `supabase db reset`. `seed.sql` is the answers;
# `seed-guesses.sql` is the ~47k-word dictionary `submit-guess` checks against —
# without it a local database rejects every guess as "not a word".
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-guesses.sql"]

[api]
enabled = true
port = 54321
# Only `public` is exposed over PostgREST. Anything that must never be reachable
# from a browser belongs outside this list.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Every player starts anonymous, and sign-in upgrades that same user rather than
# creating a second one. Both are on in production; without them locally the app
# cannot get past the first screen.
enable_anonymous_sign_ins = true
enable_manual_linking = true
site_url = "http://localhost:3900"
additional_redirect_urls = ["http://localhost:3900/auth/callback", "https://wordroom.nischalgupta.dev/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Players start anonymous and upgrade to a real account after their first result.
[auth.sessions]
inactivity_timeout = "0s"

[realtime]
enabled = true

# Placeholder Google credentials so the local stack will *build* an authorize
# URL and hand the tab over, exactly as production does. Nothing here can sign
# anyone in - the point is to be able to reproduce the trip, and abandoning it,
# without a real Google project. Production reads its own secrets.
[auth.external.google]
enabled = true
client_id = "local-placeholder.apps.googleusercontent.com"
secret = "local-placeholder-secret"
skip_nonce_check = true
