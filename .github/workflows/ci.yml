name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  sql-parity:
    name: sql parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both seeds are generated rather than committed, and `supabase start`
      # loads them from the paths in config.toml only if they are on disk. The
      # scoring and hard-mode comparisons do not care, but the puzzle-sequence
      # check below reads `word_bank` itself — against an unseeded database it
      # compares two empty banks and fails. This is the step that was missing.
      - name: Generate the seeds
        run: |
          node supabase/scripts/seed-word-bank.mjs
          node supabase/scripts/seed-guess-bank.mjs

      # Pinned, not `latest`. Resolving "latest" asks the GitHub API for the
      # newest release, and that call is unauthenticated and rate limited: it
      # failed three times in one afternoon, each time skipping the comparison
      # below and reporting the job as a parity failure it had never run. A
      # pinned version downloads the release directly and asks nothing. It is
      # also the version the parity script is checked against locally.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Only Postgres is needed. Everything else is minutes of image pulls for a
      # job that never makes an HTTP request.
      - name: Start Postgres with the migrations applied
        run: >
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,pooler

      # `submit_guess` moved the scoring and hard-mode rules into SQL. That is
      # only defensible while the two implementations agree, and until this job
      # existed nothing checked: the script was run by hand, which means it would
      # have been run once and then never again.
      - name: Hold the SQL guess path to the TypeScript one
        run: npx tsx supabase/scripts/verify-sql-parity.mts

      # Moving a guest's seats to an account is all SQL, so it is tested there.
      - name: Seat handoff
        run: >
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1 -qtA -f supabase/tests/seat_handoff.test.sql

      - name: Four at once
        run: >
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1 -qtA -f supabase/tests/four.test.sql

  seed:
    name: word bank seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The seed is generated, not committed. Fail here rather than at deploy
      # time if the wordlists drift out of shape.
      - name: Validate word lists
        run: node supabase/scripts/seed-word-bank.mjs --check

      # Also asserts every answer is typeable and each list is a real dictionary
      # — the invariants that used to be a unit test of the bundled word list.
      - name: Validate guess dictionary
        run: node supabase/scripts/seed-guess-bank.mjs --check

      # The browser calls PostgREST directly now, so an RPC without a migration
      # is 404 on every request rather than a broken corner of one function.
      - name: Every RPC the app calls has a migration
        run: node supabase/scripts/check-rpc-migrations.mjs

  functions:
    name: edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        working-directory: supabase/functions
        run: deno task check

      - name: Lint
        working-directory: supabase/functions
        run: deno lint

      - name: Format
        working-directory: supabase/functions
        run: deno fmt --check

      - name: Test
        working-directory: supabase/functions
        run: deno test --allow-read _tests/

  answers:
    name: answers stay server-side
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A blunt guard, but it catches the obvious regressions. `packages/shared`
      # is exempt: it defines PuzzleSecret, the server-only shape. Anything in
      # apps/web that genuinely needs the field (the reveal path) must say so
      # with a trailing `// answers-ok: <why>`. Workstream 6 adds the Playwright
      # assertion that no answer appears on the wire.
      - name: No answer field in app code
        run: |
          hits=$(grep -rn --include='*.ts' --include='*.tsx' --include='*.mts' \
                   --include='*.cts' --include='*.js' --include='*.jsx' --include='*.mjs' \
                   --exclude-dir=.next --exclude-dir=node_modules \\
                   -E "\\.answer\\b" apps/web | grep -v 'answers-ok:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::app code reads a puzzle answer"
            exit 1
          fi

      - name: answer column is never granted
        run: |
          if grep -nE "^\s*grant\b.*\banswer\b" supabase/migrations/*.sql; then
            echo "::error::a migration grants the answer column"
            exit 1
          fi
          grep -q "revoke all on public.puzzles from anon, authenticated" \
            supabase/migrations/20260908000200_rls.sql

  # ---------------------------------------------------------------------------
  # Playwright — workstream 6.
  #
  # The suite drives a real Supabase stack: anonymous sign-ins, the Edge
  # Functions, Postgres and realtime. It runs against a local one started on the
  # runner, never a hosted project. It used to read a hosted project from
  # secrets; when that project was deleted every test failed on DNS in 200ms,
  # and while it existed every run left rooms behind that nothing could delete.
  # A local stack needs no secrets, has no anonymous sign-in cap, and is thrown
  # away with the runner.
  # ---------------------------------------------------------------------------
  e2e:
    name: playwright e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Puzzles are drawn from `word_bank`; an unseeded stack has no words.
      - name: Generate the seeds
        run: |
          node supabase/scripts/seed-word-bank.mjs
          node supabase/scripts/seed-guess-bank.mjs

      # Pinned for the same reason as the sql parity job.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Auth, PostgREST, realtime and the edge runtime are what the app touches.
      - name: Start Supabase
        run: >
          supabase start
          -x storage-api,imgproxy,mailpit,studio,logflare,vector,supavisor,postgres-meta,pooler

      # Backgrounded so it outlives this step; the runner reaps it at the end.
      # The script vendors @wordroom/shared, which the runtime cannot see.
      - name: Serve the Edge Functions
        run: |
          nohup ./supabase/scripts/serve-functions.sh > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/create-room || true)
            if [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ]; then echo "functions up ($code)"; exit 0; fi
            sleep 2
          done
          cat functions.log
          exit 1

      # `next build` inlines NEXT_PUBLIC_* at build time, so the app needs them
      # on disk; the suite's own API calls read the same two from the env.
      - name: Point the app at the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
          } | tee apps/web/.env.local >> "$GITHUB_ENV"

      # Google's Chrome apt repo once failed its own hash check and took
      # `playwright install --with-deps` down with it. Chromium comes from
      # Playwright's download, so that source is pure overhead here.
      - name: Drop package sources this job does not need
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The suite serves this build rather than `next dev`; see the webServer
      # block in playwright.config.ts.
      - name: Build
        run: pnpm build

      - name: Playwright
        run: pnpm test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7
