# Check the version a pull request will ship matches its label.
#
# WHY IT CHECKS RATHER THAN WRITES. It used to write: compute the version, commit
# `apps/web/package.json`, push to the branch. That worked and cost two human
# clicks on every pull request, because a commit authored by
# `github-actions[bot]` trips two separate gates:
#
#   - `fork-pr-contributor-approval` is `first_time_contributors`, and the bot
#     has no merged contribution, so its runs are created and immediately closed
#     as `action_required` with zero jobs — even on a same-repo branch.
#   - the `prod` ruleset sets `require_extra_approval_for_unattributed_changes`,
#     and a bot commit is unattributed, so it demands an extra review.
#
# It also cost real signal: two runs on `perf-submit-guess-rpc` sat gated until
# that pull request merged and then resolved to `failure` having never run a
# single job. A check that never runs is worse than no check.
#
# So the bump is a human edit now, in the diff, where a reviewer can see it —
# and this job only says whether it is right.
#
# WHAT THE LEVELS MEAN HERE. Semver's usual contract is about API compatibility
# for consumers, and this app has none, so the levels are redefined around the
# only person the number is for:
#
#   major  players lose something they knew — scores reset, scoring changes
#   minor  a player would notice something new — a mode, a feature
#   patch  everything else: fixes, performance, internals
#
# Unlabelled means patch, because a forgotten label should be harmless rather
# than a release that claims more than it did.
name: version

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bump:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version this branch should carry
        id: target
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # Always bump from what is on main, never from this branch. That is
          # what makes a re-run idempotent: the answer does not drift each time
          # the workflow fires.
          base=$(git show origin/${{ github.base_ref }}:apps/web/package.json | jq -r .version)
          level=patch
          if   jq -e 'index("major")' <<<"$LABELS" >/dev/null; then level=major
          elif jq -e 'index("minor")' <<<"$LABELS" >/dev/null; then level=minor
          fi

          IFS=. read -r major minor patch <<<"$base"
          case "$level" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "base=$base"                     >> "$GITHUB_OUTPUT"
          echo "level=$level"                   >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch"   >> "$GITHUB_OUTPUT"
          echo "main is $base; a $level release makes this $major.$minor.$patch"

      - name: The branch must already carry it
        env:
          VERSION: ${{ steps.target.outputs.version }}
          LEVEL: ${{ steps.target.outputs.level }}
        run: |
          set -euo pipefail
          current=$(jq -r .version apps/web/package.json)
          if [ "$current" = "$VERSION" ]; then
            echo "version is $VERSION, which is right for a $LEVEL release"
            exit 0
          fi

          echo "::error file=apps/web/package.json::This is a $LEVEL release, so it should ship as $VERSION, but the branch says $current."
          echo ""
          echo "Set it with:"
          echo "  npm --prefix apps/web version --no-git-tag-version $VERSION"
          echo "  git commit -am 'Set version to $VERSION'"
          echo ""
          echo "Or change the label: major, minor, or none for patch."
          exit 1

      - name: Say what will ship
        if: always()
        run: |
          echo "### Ships as v${{ steps.target.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.target.outputs.level }}\` release from \`${{ steps.target.outputs.base }}\` on \`${{ github.base_ref }}\`." >> "$GITHUB_STEP_SUMMARY"
