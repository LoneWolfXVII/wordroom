# Set the version a pull request will ship, from its label.
#
# WHY IT RUNS ON THE PULL REQUEST AND NOT ON MAIN. Bumping after a merge means a
# second commit on `main`, which is a second Vercel deploy — and the deploy that
# actually shipped the change carried the *old* number. Writing the version onto
# the branch first means the merge itself ships the right one, and nothing loops.
#
# WHAT THE LEVELS MEAN HERE. Semver's usual contract is about API compatibility
# for consumers, and this app has none, so the levels are redefined around the
# only person the number is for:
#
#   major  players lose something they knew — scores reset, scoring changes
#   minor  a player would notice something new — a mode, a feature
#   patch  everything else: fixes, performance, internals
#
# Unlabelled means patch, because a forgotten label should be harmless rather
# than a release that claims more than it did.
name: version

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: version-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    # A fork's branch cannot be pushed to, and the token is read-only there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version this branch should carry
        id: target
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # Always bump from what is on main, never from this branch. That is
          # what makes a re-run idempotent: the answer does not drift each time
          # the workflow fires.
          base=$(git show origin/${{ github.base_ref }}:apps/web/package.json | jq -r .version)
          level=patch
          if   jq -e 'index("major")' <<<"$LABELS" >/dev/null; then level=major
          elif jq -e 'index("minor")' <<<"$LABELS" >/dev/null; then level=minor
          fi

          IFS=. read -r major minor patch <<<"$base"
          case "$level" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "base=$base"                     >> "$GITHUB_OUTPUT"
          echo "level=$level"                   >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch"   >> "$GITHUB_OUTPUT"
          echo "main is $base; a $level release makes this $major.$minor.$patch"

      - name: Write it, if it is not already right
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          current=$(jq -r .version apps/web/package.json)
          if [ "$current" = "$VERSION" ]; then
            echo "already $VERSION — nothing to do"
            exit 0
          fi

          jq --arg v "$VERSION" '.version = $v' apps/web/package.json > /tmp/pkg.json
          mv /tmp/pkg.json apps/web/package.json

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json
          git commit -m "Set version to $VERSION"
          git push origin HEAD:${{ github.head_ref }}

      - name: Say what will ship
        run: |
          echo "### Ships as v${{ steps.target.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.target.outputs.level }}\` release from \`${{ steps.target.outputs.base }}\` on \`${{ github.base_ref }}\`." >> "$GITHUB_STEP_SUMMARY"
